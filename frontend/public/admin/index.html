<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — PeakAndPack</title>
<style>
  :root {
    --orange: #E8650A;
    --orange-dark: #C4530A;
    --cream: #FDF8F3;
    --ink: #1A1410;
    --ink2: #3D3028;
    --ink3: #6B5E52;
    --border: rgba(26,20,16,0.12);
    --red: #C0392B;
    --green: #1A7A3A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: var(--cream); color: var(--ink); }
  header { background: var(--ink); color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #E8A87C; text-decoration: none; font-size: .9rem; }
  h1 { font-size: 1.1rem; }
  main { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }
  h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--ink); }
  .toolbar { display: flex; gap: .8rem; margin-bottom: 1.2rem; flex-wrap: wrap; align-items: center; }
  .btn { padding: .55rem 1.1rem; border-radius: 6px; font-weight: 600; font-size: .88rem; cursor: pointer; border: none; transition: background .15s; }
  .btn-primary { background: var(--orange); color: white; }
  .btn-primary:hover { background: var(--orange-dark); }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover { background: #a93226; }
  .btn-outline { background: white; color: var(--ink2); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--orange); color: var(--orange); }
  input[type="file"] { font-size: .88rem; }
  /* Product table */
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  th { background: var(--ink); color: white; padding: .6rem .9rem; font-size: .8rem; text-align: left; }
  td { padding: .6rem .9rem; font-size: .88rem; border-bottom: 1px solid var(--border); color: var(--ink2); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr.dragging { opacity: .4; }
  tr.drag-over td { background: #FEF0E6; }
  .drag-handle { cursor: grab; color: var(--ink3); padding: 0 .4rem; font-size: 1.1rem; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  /* Status messages */
  .status { padding: .7rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: .88rem; display: none; }
  .status.success { background: #D4EDDA; color: var(--green); display: block; }
  .status.error { background: #F8D7DA; color: var(--red); display: block; }
  /* Sections */
  .section { margin-bottom: 2.5rem; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  /* Auth gate */
  #auth-gate { text-align: center; padding: 4rem 1rem; }
  #auth-gate h2 { margin-bottom: 1rem; }
  #login-form { display: inline-flex; flex-direction: column; gap: .8rem; min-width: 280px; text-align: left; }
  #login-form input { padding: .6rem .9rem; border: 1px solid var(--border); border-radius: 6px; font-size: .95rem; }
  #login-error { color: var(--red); font-size: .85rem; display: none; }
  #admin-panel { display: none; }
</style>
</head>
<body>

<header>
  <h1>PeakAndPack Admin</h1>
  <a href="/" id="store-link">Back to store</a>
</header>

<main>

  <!-- Auth gate: shown until logged in as admin -->
  <div id="auth-gate">
    <h2>Admin Login</h2>
    <div id="login-form">
      <input type="email" id="admin-email" placeholder="admin@peakandpack.com" value="admin@peakandpack.com">
      <input type="password" id="admin-password" placeholder="Password" value="adminpass123">
      <button class="btn btn-primary" onclick="adminLogin()">Sign in as admin</button>
      <span id="login-error">Invalid credentials or not an admin account.</span>
    </div>
  </div>

  <!-- Admin panel: shown after successful admin login -->
  <div id="admin-panel">

    <div id="status-msg" class="status"></div>

    <!-- Product management -->
    <div class="section">
      <div class="section-header">
        <h2>Products</h2>
        <div class="toolbar">
          <!-- CSV export: download link (Phase 8: file download) -->
          <a id="export-link" class="btn btn-outline" download="products.csv">Export CSV</a>
          <!-- CSV import: file upload (Phase 8: file upload) -->
          <label class="btn btn-outline" style="cursor:pointer;">
            Import CSV
            <input type="file" id="csv-file" accept=".csv" style="display:none" onchange="importCSV(this)">
          </label>
        </div>
      </div>

      <table id="products-table">
        <thead>
          <tr>
            <th style="width:2rem"></th>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Category</th>
            <th style="width:5rem">Actions</th>
          </tr>
        </thead>
        <tbody id="products-tbody">
          <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--ink3)">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div><!-- /admin-panel -->
</main>

<!-- Sandboxed payment iframe (Phase 8: iframe) -->
<!-- This is rendered on the /admin/payment-test page, linked from the store checkout -->
<script>
const API = window.location.origin;
let adminToken = null;

// ── Authentication ──────────────────────────────────────────────────────────
async function adminLogin() {
  const email = document.getElementById('admin-email').value.trim();
  const password = document.getElementById('admin-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok || !data.token) throw new Error(data.error || 'Login failed');

    // Verify it's actually an admin token
    const payload = JSON.parse(atob(data.token.split('.')[1]));
    if (payload.role !== 'admin') throw new Error('Not an admin account');

    adminToken = data.token;
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';

    // Set up the export link with auth
    document.getElementById('export-link').href =
      `${API}/api/admin/products/export`;
    document.getElementById('export-link').onclick = (e) => {
      e.preventDefault();
      downloadCSV();
    };

    loadProducts();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}

// ── Load products ───────────────────────────────────────────────────────────
async function loadProducts() {
  const res = await fetch(`${API}/api/admin/products`, {
    headers: { Authorization: `Bearer ${adminToken}` },
  });
  const { products } = await res.json();
  renderTable(products);
}

// ── Render table with drag handles ─────────────────────────────────────────
function renderTable(products) {
  const tbody = document.getElementById('products-tbody');
  tbody.innerHTML = '';
  products.forEach(p => {
    const tr = document.createElement('tr');
    tr.dataset.id = p.id;
    tr.draggable = true;
    tr.innerHTML = `
      <td><span class="drag-handle" title="Drag to reorder">&#9776;</span></td>
      <td>${escHtml(p.name)}</td>
      <td>$${Number(p.price).toFixed(2)}</td>
      <td>${p.stock}</td>
      <td>${escHtml(p.category || '')}</td>
      <td>
        <button class="btn btn-danger" style="padding:.3rem .7rem;font-size:.8rem"
          onclick="deleteProduct(${p.id}, '${escHtml(p.name)}')">Delete</button>
      </td>
    `;
    // Drag events
    tr.addEventListener('dragstart', onDragStart);
    tr.addEventListener('dragover', onDragOver);
    tr.addEventListener('dragleave', onDragLeave);
    tr.addEventListener('drop', onDrop);
    tr.addEventListener('dragend', onDragEnd);
    tbody.appendChild(tr);
  });
}

// ── Delete product (Phase 8: confirm dialog) ────────────────────────────────
async function deleteProduct(id, name) {
  // Native browser confirm dialog -- exactly what Phase 8 tests
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;

  const res = await fetch(`${API}/api/admin/products/${id}`, {
    method: 'DELETE',
    headers: { Authorization: `Bearer ${adminToken}` },
  });
  if (res.ok) {
    showStatus(`"${name}" deleted.`, 'success');
    loadProducts();
  } else {
    const data = await res.json();
    showStatus(data.error || 'Delete failed.', 'error');
  }
}

// ── CSV import (Phase 8: file upload) ──────────────────────────────────────
async function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);

  const res = await fetch(`${API}/api/admin/products/import`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${adminToken}` },
    body: formData,
  });
  const data = await res.json();
  if (res.ok) {
    showStatus(`Imported ${data.imported} products.`, 'success');
    loadProducts();
  } else {
    showStatus(data.error || 'Import failed.', 'error');
  }
  input.value = ''; // reset so same file can be re-uploaded
}

// ── CSV export (Phase 8: file download) ────────────────────────────────────
async function downloadCSV() {
  const res = await fetch(`${API}/api/admin/products/export`, {
    headers: { Authorization: `Bearer ${adminToken}` },
  });
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'products.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Drag and drop reorder (Phase 8: drag and drop) ─────────────────────────
let dragSrc = null;

function onDragStart(e) {
  dragSrc = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  this.classList.add('drag-over');
}
function onDragLeave() {
  this.classList.remove('drag-over');
}
function onDrop(e) {
  e.stopPropagation();
  if (dragSrc !== this) {
    const tbody = document.getElementById('products-tbody');
    const rows = [...tbody.querySelectorAll('tr')];
    const srcIdx = rows.indexOf(dragSrc);
    const tgtIdx = rows.indexOf(this);
    if (srcIdx < tgtIdx) {
      tbody.insertBefore(dragSrc, this.nextSibling);
    } else {
      tbody.insertBefore(dragSrc, this);
    }
    saveOrder();
  }
  this.classList.remove('drag-over');
}
function onDragEnd() {
  this.classList.remove('dragging');
  document.querySelectorAll('#products-tbody tr').forEach(tr => tr.classList.remove('drag-over'));
}

async function saveOrder() {
  const rows = [...document.querySelectorAll('#products-tbody tr')];
  const order = rows.map((tr, i) => ({ id: Number(tr.dataset.id), sort_order: i + 1 }));
  const res = await fetch(`${API}/api/admin/products/reorder`, {
    method: 'PATCH',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${adminToken}`,
    },
    body: JSON.stringify({ order }),
  });
  if (res.ok) {
    showStatus('Order saved.', 'success');
  }
}

// ── Helpers ─────────────────────────────────────────────────────────────────
function showStatus(msg, type) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = `status ${type}`;
  setTimeout(() => { el.className = 'status'; }, 3500);
}

function escHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
</script>
</body>
</html>
